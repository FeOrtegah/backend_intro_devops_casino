name: Build, Push & Deploy database

on:
  push:
    branches: [ deploy ]
    paths: [ 'db/**' ]
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login a ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Build imagen database
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/casino-db
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest ./db

      - name: Push imagen a ECR
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/casino-db
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy en EC2-database
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_DATABASE_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker volume create pg_data || true
            docker rm -f casino-db || true
            docker run -d \
              --name casino-db \
              --restart unless-stopped \
              -p 5432:5432 \
              -v pg_data:/var/lib/postgresql/data \
              -e POSTGRES_USER=casino \
              -e POSTGRES_PASSWORD='ULjWbjXGBX0C7dUSSMkBpQEnoD4weSpcexiYTNQQ23u=' \
              -e POSTGRES_DB=casino_db \
              postgres:16-alpine
            sleep 10
            docker exec -i casino-db psql -U casino -d casino_db << 'EOF'
            CREATE TABLE IF NOT EXISTS usuarios (
              id SERIAL PRIMARY KEY,
              username VARCHAR(40) NOT NULL UNIQUE,
              email VARCHAR(120) NOT NULL UNIQUE,
              password_hash VARCHAR(255) NOT NULL,
              saldo NUMERIC(12,2) NOT NULL DEFAULT 1000.00,
              rol VARCHAR(20) NOT NULL DEFAULT 'jugador',
              creado_en TIMESTAMP NOT NULL DEFAULT NOW()
            );
            INSERT INTO juegos (codigo, nombre, descripcion, apuesta_min, apuesta_max) VALUES
              ('slots', 'Tragamonedas', 'Maquina de 3 rodillos con 8 simbolos.', 10, 500),
              ('roulette', 'Ruleta', 'Ruleta europea', 10, 1000),
              ('blackjack', 'Blackjack', 'Cartas contra la banca', 20, 2000)
            ON CONFLICT (codigo) DO NOTHING;
            EOF
