name: Build, Push & Deploy database

on:
  push:
    branches: [ deploy ]
    paths: [ 'db/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build imagen database
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/casino-db
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest ./db

  push:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push imagen
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/casino-db
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy:
    runs-on: ubuntu-latest
    needs: push
    steps:
      - name: Deploy en EC2-database
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_DATABASE_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker volume create pg_data || true
            docker rm -f casino-db || true
            docker run -d --name casino-db --restart unless-stopped \
              -p 5432:5432 \
              -v pg_data:/var/lib/postgresql/data \
              -e POSTGRES_USER=casino \
              -e POSTGRES_PASSWORD='ULjWbjXGBX0C7dUSSMkBpQEnoD4weSpcexiYTNQQ23u=' \
              -e POSTGRES_DB=casino_db \
              postgres:16-alpine
