name: Build, Push & Deploy backend

on:
  push:
    branches: [ deploy ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      ecr_registry: ${{ steps.ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login a ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build imagen
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/casino-backend
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
        id: build

      - name: Guardar tag
        id: tag
        run: echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

  push:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login a ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull imagen del build
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/casino-backend
          docker pull $IMAGE:${{ needs.build.outputs.image_tag }} || true

      - name: Push imagen
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/casino-backend
          docker push $IMAGE:${{ needs.build.outputs.image_tag }}
          docker push $IMAGE:latest

  deploy:
    runs-on: ubuntu-latest
    needs: push
    steps:
      - name: Desplegar en EC2-backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin \
                ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/casino-backend:latest
            docker rm -f casino-backend || true
            docker run -d --name casino-backend --restart unless-stopped \
              -p 3000:3000 \
              -e DB_HOST=${{ secrets.DB_HOST_PRIVATE }} \
              -e DB_USER=casino \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e DB_NAME=casino_db \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e CORS_ORIGIN="*" \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/casino-backend:latest
